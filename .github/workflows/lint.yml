name: Lint
on: [push]
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Use Node.js 24.22.1
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Install dependencies and build (with cache)
        uses: bahmutov/npm-install@v1

      - name: Lint
        run: yarn lint
